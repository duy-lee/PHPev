name: Release

# Pushing a tag such as v0.1.0 builds the installer and the zip and creates a
# DRAFT GitHub Release with them; publishing the draft is done by hand.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal --component clippy,rustfmt
          rustup default stable

      - name: Check the tag matches the version
        shell: pwsh
        run: |
          $version = (Select-String -Path Cargo.toml -Pattern '^version = "(.+)"').Matches[0].Groups[1].Value
          if ("v$version" -ne $env:GITHUB_REF_NAME) { throw "tag $env:GITHUB_REF_NAME does not match Cargo.toml version $version" }
          "VERSION=$version" >> $env:GITHUB_ENV

      - name: Test
        run: cargo test --locked

      - name: Build
        run: cargo build --release --locked

      - name: Check the executables
        shell: pwsh
        run: ./.github/scripts/check-binaries.ps1 target/release

      - name: Package
        shell: pwsh
        run: |
          $name = "phpev-$env:VERSION-windows-x64"
          $dir = "dist/$name"
          New-Item -ItemType Directory -Force $dir | Out-Null
          foreach ($f in 'phpev.exe', 'phpev-daemon.exe', 'phpev-elevate.exe', 'phpev-shim.exe') {
            Copy-Item "target/release/$f" $dir
          }
          Copy-Item README.md, LICENSE-MIT, LICENSE-APACHE, CHANGELOG.md $dir
          Compress-Archive -Path "$dir/*" -DestinationPath "dist/$name.zip"

      - name: Installer
        shell: pwsh
        run: ./.github/scripts/build-installer.ps1 -Version $env:VERSION

      - name: Checksums
        shell: pwsh
        run: |
          $files = "phpev-$env:VERSION-setup.exe", "phpev-$env:VERSION-windows-x64.zip"
          $files | ForEach-Object { "$((Get-FileHash "dist/$_" -Algorithm SHA256).Hash.ToLower())  $_" } |
            Out-File -Encoding ascii dist/SHA256SUMS.txt
          Get-Content dist/SHA256SUMS.txt

      - name: Release notes from CHANGELOG.md
        shell: pwsh
        run: |
          $lines = Get-Content CHANGELOG.md
          $start = ($lines | Select-String -Pattern "^## \[$([regex]::Escape($env:VERSION))\]").LineNumber
          if (-not $start) { throw "CHANGELOG.md has no section for $env:VERSION" }
          $rest = $lines[$start..($lines.Length - 1)]
          $end = ($rest | Select-String -Pattern '^## \[' | Select-Object -First 1).LineNumber
          $notes = if ($end) { $rest[0..($end - 2)] } else { $rest }
          $notes | Out-File -Encoding utf8 dist/notes.md

      - name: Create the draft release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $flags = @('--draft', '--title', "PHPev $env:VERSION", '--notes-file', 'dist/notes.md')
          # 0.x versions and versions like 1.0.0-rc.1 are marked as pre-releases.
          if ($env:VERSION -match '^0\.' -or $env:VERSION -match '-') { $flags += '--prerelease' }
          gh release create $env:GITHUB_REF_NAME @flags "dist/phpev-$env:VERSION-setup.exe" "dist/phpev-$env:VERSION-windows-x64.zip" dist/SHA256SUMS.txt
